{% extends 'base.html' %}

{% block title %}Forgot Password | GamingMouse{% endblock %}

{% block content %}
<main class="auth-page blue-auth-page">
    <div class="container position-relative py-5">
        <div class="row justify-content-center">
            <div class="col-md-5 col-lg-4">
                <div class="auth-card shadow-lg"><div class="card-body p-4 p-lg-5">
                    <span class="eyebrow">ACCOUNT RECOVERY</span>
                    <h3 class="mb-2 mt-2">Reset your password</h3>
                    <p class="text-muted mb-4">Enter your account email and we will send a reset link.</p>
                    <form method="post">
                        {% csrf_token %}
                        {{ form.email.errors }}
                        <div class="mb-3"><label class="form-label" for="id_email">Email</label>{{ form.email }}</div>
                        <button type="submit" class="btn btn-primary w-100">Send reset link</button>
                    </form>
                    <p class="text-center mt-4 mb-0"><a href="{% url 'login' %}">Back to login</a></p>
                </div></div>
            </div>
        </div>
    </div>
</main>
{% endblock %}
