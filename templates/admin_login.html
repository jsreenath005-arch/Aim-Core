{% extends 'base.html' %}

{% block title %}Admin Login | GamingMouse{% endblock %}

{% block content %}
<main class="auth-page blue-auth-page login-page">
    <div class="auth-overlay"></div>
    <div class="container position-relative py-5">
        <div class="row justify-content-center">
            <div class="col-md-5 col-lg-4">
                <div class="auth-card shadow-lg">
                    <div class="card-body p-4 p-lg-5">
                        <span class="eyebrow">ADMIN ACCESS</span>
                        <h3 class="mb-2 mt-2">Admin login</h3>
                        <p class="text-muted mb-4">Sign in to manage products and customer accounts.</p>
                        {% if error %}<div class="alert alert-danger" role="alert">{{ error }}</div>{% endif %}
                        <form method="post">
                            {% csrf_token %}
                            <div class="mb-3">
                                <label class="form-label" for="admin-login-identifier">Username or email <span class="required-mark" aria-hidden="true">*</span></label>
                                <input id="admin-login-identifier" type="text" name="identifier" class="form-control" maxlength="254" autocomplete="username" required autofocus>
                            </div>
                            <div class="mb-3">
                                <label class="form-label" for="admin-login-password">Password <span class="required-mark" aria-hidden="true">*</span></label>
                                <input id="admin-login-password" type="password" name="password" class="form-control" autocomplete="current-password" required>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">Admin Login</button>
                        </form>
                        <p class="text-center text-muted mt-4 mb-0"><a href="{% url 'login' %}">Customer login</a></p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>
{% endblock %}
